name: ci
on:
  push:
  workflow_dispatch:

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Core unit tests
        run: gradle -p poc :core:test --no-daemon --stacktrace
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('poc/core/build/test-results/test/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests'));f+=int(r.get('failures'));e+=int(r.get('errors'));s+=int(r.get('skipped'))
          print(f'TESTS total={t} failures={f} errors={e} skipped={s}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: |
            poc/core/build/reports/tests/test
            poc/core/build/test-results/test

  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Android SDK optional libraries (diagnostic)
        run: ls "$ANDROID_HOME/platforms/android-35/optional" || true
      - name: Assemble debug APK
        run: gradle -p poc :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: poc/app/build/outputs/apk/debug/*.apk

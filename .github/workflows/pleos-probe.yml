name: pleos-probe
# Pleos Connect Emulator 2.1.0 (공식 시스템 이미지)를 KVM 러너에서 띄워 보는 실험용 워크플로.
# 이미지는 Pleos 공식 SDK 사이트(nexus-playground.pleos.ai)에서 받으며 아티팩트로 재배포하지 않는다.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'script to run after boot (poc/pleos/*.sh)'
        default: 'poc/pleos/probe.sh'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMG_URL: https://nexus-playground.pleos.ai/repository/raw-releases/connect-avd/2.x/crp_car_emulator.zip
      IMG_SHA1: b4f858d5bcc6c71506d7edfc872bcb9e5a11acaa
      OUT: ${{ github.workspace }}/pleos-out
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/lib/node_modules /opt/microsoft /usr/local/share/powershell || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h / /mnt || true; free -g; nproc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Assemble debug APK
        run: gradle -p poc :app:assembleDebug --no-daemon
      - name: Download Pleos Connect Emulator image
        run: |
          mkdir -p $HOME/pleos
          time curl -fSL --retry 3 -o $HOME/pleos/img.zip "$IMG_URL"
          echo "$IMG_SHA1  $HOME/pleos/img.zip" | sha1sum -c
          df -h /
      - name: Install image
        run: |
          set -x
          mkdir -p "$OUT"
          exec > >(tee -a "$OUT/install.log") 2>&1
          cd $HOME/pleos && rm -rf x && mkdir x && cd x
          unzip -q ../img.zip && rm -f ../img.zip
          df -h / | tee "$OUT/df.txt"
          du -sh . | tee -a "$OUT/df.txt"
          find . -maxdepth 3 | head -50 | tee "$OUT/zip_layout.txt"
          SP=$(dirname "$(find . -name source.properties | head -1)")
          cat "$SP/source.properties" | tee "$OUT/source.properties"
          D=$ANDROID_HOME/system-images/android-34/pleos_car_emulator
          sudo mkdir -p "$D" && sudo chown -R $USER "$ANDROID_HOME/system-images"
          rm -rf "$D/x86_64"; ln -s "$HOME/pleos/x/$SP" "$D/x86_64"
          ls -la "$D/x86_64/" | tee "$OUT/img_files.txt"
      - name: Update emulator + create AVD
        run: bash poc/pleos/setup_avd.sh || true
      - name: Boot + run script
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          # Pleos 이미지는 adb 인증을 요구: 에뮬레이터보다 먼저 adb 키를 만들어 두면 에뮬레이터가 공개키를 넘겨 준다
          $ANDROID_HOME/platform-tools/adb start-server; ls -la $HOME/.android/ > "$OUT/adbkey.txt"
          nohup $ANDROID_HOME/emulator/emulator -avd pleos -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio -camera-back none -camera-front none -verbose > "$OUT/emulator.log" 2>&1 &
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          timeout 600 adb wait-for-device || { echo "no device" > "$OUT/boot.txt"; exit 0; }
          t=0; until [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] || [ $t -ge 1200 ]; do sleep 5; t=$((t+5)); done
          echo "boot wait ${t}s" | tee "$OUT/boot.txt"
          timeout 2400 bash "${{ github.event.inputs.script || 'poc/pleos/probe.sh' }}" > "$OUT/script.log" 2>&1 || echo "script exit $?" >> "$OUT/script.log"
      - name: Collect
        if: always()
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          timeout 30 adb logcat -d > "$OUT/logcat_final.txt" 2>/dev/null || true
          timeout 20 adb emu kill || true
          df -h / > "$OUT/df_end.txt" || true
          tail -200 "$OUT/emulator.log" > "$OUT/emulator_tail.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pleos-out
          path: pleos-out/
